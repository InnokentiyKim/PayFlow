[project]
name = "analytics-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.13.0",
    "alembic>=1.18.4",
    "asgi-correlation-id>=4.3.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "greenlet>=3.3.2",
    "mypy>=1.20.0",
    "pydantic-settings>=2.13.1",
    "redis>=7.4.0",
    "ruff>=0.15.9",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
test = [
    "aiosqlite>=0.22.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28",
    "fakeredis>=2.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true
