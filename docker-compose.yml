services:
  payment_db:
    image: postgres:16-alpine
    container_name: payment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${PAYMENT_POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${PAYMENT_POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${PAYMENT_POSTGRES_DB:-postgres}"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    ports:
      - "${PAYMENT_POSTGRES_PORT:-5432}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_POSTGRES_USER:-postgres} -d ${PAYMENT_POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  analytics_db:
    image: postgres:16-alpine
    container_name: analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${ANALYTICS_POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${ANALYTICS_POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${ANALYTICS_POSTGRES_DB:-postgres}"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    ports:
      - "${ANALYTICS_POSTGRES_PORT:-5431}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_POSTGRES_USER:-postgres} -d ${ANALYTICS_POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: payment-redis
    restart: unless-stopped
    environment:
      REDIS_PORT: ${REDIS_PORT:-6379}
    command: >
      redis-server
      --port ${REDIS_PORT:-6379}
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    networks:
      - app-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    environment:
      # KRaft settings
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_NODE_ID:-1}@kafka:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAME:-CONTROLLER}

      # Listeners
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT:-9092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093},PLAINTEXT_HOST://0.0.0.0:${KAFKA_EXTERNAL_PORT:-29092}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-9092},PLAINTEXT_HOST://${KAFKA_HOST:-kafka}:${KAFKA_EXTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER:-PLAINTEXT}

      # Broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-true}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR:-1}

      # KRaft cluster ID (generate once: kafka-storage random-uuid)
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_INTERNAL_PORT:-9092}:${KAFKA_INTERNAL_PORT:-9092}"  # internal communication
      - "${KAFKA_CONTROLLER_PORT:-9093}:${KAFKA_CONTROLLER_PORT:-9093}"  # controller communication
      - "${KAFKA_EXTERNAL_PORT:-29092}:${KAFKA_EXTERNAL_PORT:-29092}"  # external communication

    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  payment-service:
    container_name: payment-service
    build:
      context: ./payment-service
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./payment-service/.env
    depends_on:
      payment_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "${PAYMENT_APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-provider:
    container_name: payment-provider
    build:
      context: ./payment-provider-mock
      dockerfile: Dockerfile

    restart: unless-stopped
    depends_on:
      payment-service:
        condition: service_started
    ports:
      - "${PROVIDER_PORT:-8001}:8001"
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT:-9092}
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy

  analytics-service:
    container_name: analytics-service
    build:
      context: ./analytics-service
      dockerfile: Dockerfile

    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s

    env_file:
      - ./analytics-service/.env
    depends_on:
      analytics_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "${ANALYTICS_APP_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  payment_db_data:
  analytics_db_data:
  redis_data:
  kafka_data:

networks:
  app-network:
    driver: bridge
